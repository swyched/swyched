<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWYCHD</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      padding: 24px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .hero {
      padding-top: 90px;
      text-align: center;
    }

    .hero h1 {
      font-size: 48px;
      line-height: 0.95;
      letter-spacing: -3px;
    }

    .hero p {
      margin-top: 20px;
      color: #aaa;
      font-size: 16px;
    }

    .button {
      width: 100%;
      margin-top: 35px;
      padding: 17px;
      border: none;
      border-radius: 14px;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .button:hover {
      opacity: 0.85;
    }

    .flux {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #333;
      border-radius: 18px;
    }

    .flux-label {
      color: #888;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .flux-number {
      margin-top: 6px;
      font-size: 32px;
      font-weight: 800;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">
      SWYCHD
    </div>

    <section class="hero">

      <h1>
        LIVE<br>
        DIFFERENT.
      </h1>

      <p>
        Enter someone else's reality.<br>
        Complete their challenges.<br>
        Earn your FLUX.
      </p>

      <button class="button" onclick="startApp()">
        GET SWYCHD
      </button>

      <div class="flux">
        <div class="flux-label">
          Your FLUX
        </div>

        <div class="flux-number">
          0 ⚡
        </div>
      </div>

    </section>

  </main>

  <script>
    function startApp() {
      alert("Welcome to SWYCHD 🔄");
    }
  </script>

</body>
</html>
